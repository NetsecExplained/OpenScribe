<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recording...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .container {
      width: 160px;
      height: 35px;
      background: rgba(30, 30, 30, 0.95);
      border-radius: 18px;
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #F44336;
      border-radius: 50%;
      margin-right: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    .waveform-container {
      flex: 1;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }

    .waveform-bar {
      width: 2px;
      background: linear-gradient(to top, #667eea, #764ba2);
      border-radius: 1px;
      transition: height 0.1s ease;
    }

    .text {
      color: white;
      font-size: 9px;
      margin-left: 6px;
      white-space: nowrap;
      font-weight: 500;
    }

    /* Spinner Animation */
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    .spinner.active {
      display: block;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .waveform-container.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="status-dot"></div>
    <div class="waveform-container" id="waveform">
      <!-- Waveform bars will be generated by JS -->
    </div>
    <div class="spinner" id="spinner"></div>
    <div class="text" id="status-text">Recording...</div>
  </div>

  <audio id="start-sound" preload="auto">
    <source src="assets/start-recording.wav" type="audio/wav">
  </audio>
  <audio id="stop-sound" preload="auto">
    <source src="assets/stop-recording.wav" type="audio/wav">
  </audio>

  <script src="recording-popup.js"></script>
</body>
</html>
